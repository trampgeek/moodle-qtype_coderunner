name: Moodle plugin CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README*'
      - 'LICENSE'
      - '.gitignore'
      - 'site/**'
      - '*.html'
      - 'mkdocs.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README*'
      - 'LICENSE'
      - '.gitignore'
      - 'site/**'
      - '*.html'
      - 'mkdocs.yml'

jobs:
  test:
    runs-on: 'ubuntu-latest'

    strategy:
      fail-fast: false
      matrix:
        include:
          # CodeRunner 6 requires Moodle 5.0 or later (see version.php), so no
          # branch before MOODLE_500_STABLE is tested. The PHP version on each
          # row is that branch's own minimum or later: 5.0 and 5.1 require PHP
          # 8.2, 5.2 and 5.3 require PHP 8.3. No branch supports PHP 8.5 yet --
          # Moodle's own CI tops out at 8.4 -- so 8.4 is the ceiling here.
          #
          # 5.3 runs on pgsql because it is the first branch to require MariaDB
          # 11.4, and the mariadb service below is deliberately pinned to the
          # 10.11 that 5.0 to 5.2 declare as their floor, so that the oldest
          # supported MariaDB keeps being tested.
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'pgsql'
          - php: '8.4'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'mariadb'
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
            database: 'mariadb'
    services:
      postgres:
        # Moodle's own floor: 5.0 requires postgres 14, 5.1 requires 15, 5.2
        # requires 16 and 5.3 requires 17, so the image has to keep pace with
        # the newest branch tested on pgsql or install.php refuses the
        # environment check.
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        # Pinned to the floor that 5.0 to 5.2 declare, so that the oldest
        # supported MariaDB is exercised. 5.3 needs 11.4 and so is tested on
        # pgsql instead; bumping this image would silently drop that coverage.
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout
        # v2 declares "using: node12" in its action.yml, and Node 12 went
        # end-of-life in April 2022, so the runs were carrying GitHub's
        # deprecation annotations. The runtime is removed from runner images
        # eventually, and when it goes this step fails on every row at once.
        # v4 is node20: clear of the retired runtimes, and the major that
        # upload-artifact@v4 below pairs with. v5 exists and wants node24,
        # which a plain checkout gains nothing from.
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5.7
          # Add dirs to $PATH
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          # PHPUnit depends on en_AU.UTF-8 locale
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Start JobeInABox
        run: sudo docker run -d -p 4000:80 --name jobe trampgeek/jobeinabox:latest

      - name: Let JobeInABox settle
        run: sleep 5s

      - name: Test JobeInABox
        run: |
          curl http://localhost:4000/jobe/index.php/restapi/languages
          curl http://localhost:4000/jobe/index.php/restapi/runs -H 'Content-Type: application/json; charset=utf-8' --data-binary '{"run_spec":{"language_id":"python3","sourcecode":"print(\"Hello sandbox!\")","sourcefilename":"__tester__.python3","input":"","file_list":[]}}'

      - name: Create Test sandbox configuration
        run: |
          echo "<?php"                                                          >  plugin/tests/fixtures/test-sandbox-config.php
          echo "set_config('jobesandbox_enabled', 1, 'qtype_coderunner');"      >> plugin/tests/fixtures/test-sandbox-config.php
          echo "set_config('jobe_host', 'localhost:4000', 'qtype_coderunner');" >> plugin/tests/fixtures/test-sandbox-config.php
          # Display it, at least for now, so it is east to check.
          cat plugin/tests/fixtures/test-sandbox-config.php

      - name: Install Moodle
        run: |
          moodle-plugin-ci add-plugin trampgeek/moodle-qbehaviour_adaptive_adapted_for_coderunner
          moodle-plugin-ci add-plugin trampgeek/moodle-local_coderunner_manager
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
          moodle-plugin-ci add-config 'define("QTYPE_CODERUNNER_JOBE_HOST", "localhost:4000");'
          # Behat's "Step 0" visit allows get_extended_timeout() seconds for
          # M.util.pending_js to drain, and that is 10 by default. The queue has
          # been measured taking 11.4 seconds to attach the first Ace editor and
          # 18.6 to drain on a cold cache, which a CI runner is every time, so 10
          # was always below the real cost. Three times over gives 30.
          moodle-plugin-ci add-config '$CFG->behat_increasetimeout = 3;'
          # Nothing in CodeRunner depends on TinyMCE -- which editor renders the
          # question text is a user preference -- but its initialisation is the
          # largest single contributor to that queue, and on MOODLE_503_STABLE it
          # stopped draining at all, failing nearly every scenario in
          # editor_tiny/editor and defaultConfiguration. The plain textarea takes
          # it out of the picture so a CodeRunner test fails for CodeRunner
          # reasons. behat_clean_init_config() discards any config.php setting not
          # on its allowlist or prefixed behat_, so texteditors has to be added to
          # it or the Behat site silently keeps its own value.
          moodle-plugin-ci add-config '$CFG->texteditors = "textarea";'
          moodle-plugin-ci add-config '$CFG->behat_extraallowedsettings = array_merge($CFG->behat_extraallowedsettings ?? [], ["texteditors"]);'
          # moodle-plugin-ci reads behat_faildump_path but never sets it, so a
          # failing job has been writing no screenshots or HTML at all, leaving
          # only a stack trace to reason from. The directory has to exist.
          mkdir -p "$GITHUB_WORKSPACE/behatfaildumps"
          moodle-plugin-ci add-config '$CFG->behat_faildump_path = getenv("GITHUB_WORKSPACE") . "/behatfaildumps";'
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci grunt

      - name: PHPUnit tests
        if: ${{ always() }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        if: ${{ always() }}
        # 5.3 is on probation: it failed nearly every scenario on its first two
        # runs, in TinyMCE rather than in anything of ours, and a flood of
        # output over two hours is not worth blocking the other three rows for.
        # If it is still bad with the plain textarea above, drop the row.
        continue-on-error: ${{ matrix.moodle-branch == 'MOODLE_503_STABLE' }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat faildumps
        # Not failure(): the 5.3 row's Behat step is continue-on-error, so a
        # failure there does not mark the job failed and failure() would skip
        # the upload for the row the dumps are most wanted from. With
        # if-no-files-found: ignore, a passing job costs nothing here.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildumps-${{ matrix.moodle-branch }}-php${{ matrix.php }}
          path: behatfaildumps
          retention-days: 7
          if-no-files-found: ignore
